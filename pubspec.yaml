name: lamaalam
description: "LAMAALAM – relevé, métré, devis et suivi de chantier (Groupe LAMAALAM)."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.11.0 <4.0.0"
  flutter: ">=3.41.6"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  provider: ^6.1.2
  path_provider: ^2.1.4
  image_picker: ^1.1.2
  pdf: ^3.11.1
  printing: ^5.13.4
  share_plus: ^13.3.1
  url_launcher: ^6.3.1
  uuid: ^4.5.1
  crypto: ^3.0.8
  dio: ^5.11.1
  flutter_secure_storage: ^11.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/branding/logo_lamaalam_corrige_512.png
    - assets/fonts/NotoSans-Regular.ttf
    - assets/fonts/NotoSans-Bold.ttf
    - assets/fonts/NotoSansArabic-Regular.ttf
    - assets/fonts/NotoSansArabic-Bold.ttf
